spring.application.name=DMartServiceRegistry


# Eureka Server port
server.port=8761

# Eureka Server configuration
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false


management.endpoints.web.exposure.include=health,info,metrics,beans

management.info.env.enabled=true
info.app.name=Eureka Service Registry
info.app.description=Eureka Service Registry application
info.app.version=1.0.0